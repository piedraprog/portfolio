<section class="flex flex-col text-primary">
  <app-navbar></app-navbar>
  <div class="flex h-[60vh] sm:h-[70vh] md:h-[80vh] lg:h-[100vh]">
    <h1
      appSectionHero
      class="font-extrabold text-[10vh] sm:text-[14vh] md:text-[18vh] lg:text-[24vh] self-end ml-2 sm:ml-4 uppercase"
    >
      {{ pageName }}
    </h1>
  </div>
</section>

<app-scrolling-text [text]="pageName"></app-scrolling-text>

<section class="bg-background text-primary px-4 sm:px-8 md:px-16 pt-12 md:pt-20 pb-24 md:pb-40">
  <div class="flex flex-col md:flex-row md:items-end md:justify-between gap-4 mb-16">
    <p class="uppercase font-semibold text-sm md:text-lg max-w-md">
      Product-minded software engineer. Angular and TypeScript first.
    </p>
    <p class="uppercase font-semibold text-sm md:text-lg">last update // 2026</p>
  </div>

  <div class="grid gap-16 lg:grid-cols-[minmax(0,1.2fr)_minmax(0,0.8fr)] lg:gap-24">
    <div class="flex flex-col gap-8 max-w-3xl">
      <p class="text-xl md:text-3xl font-medium leading-relaxed">
        {{ aboutme }}
      </p>
      <p class="text-lg md:text-2xl font-medium leading-relaxed">
        {{ aboutme2 }}
      </p>
      <button
        type="button"
        class="self-start uppercase font-semibold text-sm md:text-lg cursor-pointer hover-underline-animation focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-4"
        (click)="goTo()"
      >
        LinkedIn
      </button>
    </div>

    <div>
      <h2 class="uppercase font-bold text-2xl md:text-4xl mb-8">Experience</h2>
      <ul class="flex flex-col">
        @for (job of tableInfo; track job.company + job.time) {
          <li class="border-t-2 border-primary py-6">
            <p class="uppercase font-bold text-lg md:text-2xl">{{ job.job }}</p>
            <p class="uppercase font-semibold text-sm md:text-base mt-2">
              {{ job.company }}
            </p>
            <p class="text-sm md:text-base mt-1">{{ job.time }}</p>
          </li>
        }
      </ul>
      <div class="border-t-2 border-primary"></div>
    </div>
  </div>
</section>

<app-footer></app-footer>
