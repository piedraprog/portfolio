  <ul
    class="flex flex-1 flex-col justify-center gap-[clamp(0.75rem,3vh,3.5rem)] min-h-screen py-[10vh] px-4 md:px-10"
  >
  <!-- TODO: ADD hover colors -->
    @for (item of menuItems; track item.route) {
      <li
        class="nav-menu-item ml-1"
        [style.--start-position]="startPosition"
        (mouseenter)="setStartPosition($event)"
      >
        <button
          type="button"
          class="nav-link font-extrabold uppercase text-left leading-none text-[clamp(2.4rem,9vh,11rem)] hover-underline-animation focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-4"
          [class.cursor-pointer]="item.available"
          [class.cursor-not-allowed]="!item.available"
          [class.opacity-40]="!item.available"
          [disabled]="!item.available"
          [attr.aria-disabled]="!item.available"
          (click)="goTo(item)"
        >
          {{ item.label }}
        </button>
      </li>
    }
  </ul>

  <button
    type="button"
    (click)="closeMenu()"
    aria-label="Close menu"
    class="absolute top-8 right-6 md:top-16 md:right-16 min-w-11 min-h-11 flex items-center justify-center font-semibold text-[clamp(1.5rem,4vh,4rem)] text-primary hover:text-accent cursor-pointer focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-4"
  >
    X
  </button>
